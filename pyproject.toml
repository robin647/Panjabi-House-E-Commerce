[tool.ruff]
line-length = 119
target-version = "py312"
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "DTZ", "BLE"]
ignore = [
    "RUF012",  # Django Meta.ordering / Meta.indexes are conventionally mutable list literals; not a real bug.
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
# Standard Django settings-module split pattern (base -> dev/test/prod via `from .base import *`).
"config/settings/*.py" = ["F403", "F405"]
